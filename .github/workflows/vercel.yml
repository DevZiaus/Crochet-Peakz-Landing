name: Vercel

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: vercel-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build

    deploy:
        name: Deploy
        needs: validate
        if: >-
            github.event_name == 'push' ||
            (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Pull Vercel environment
              run: npx vercel@latest pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
              env:
                  VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

            - name: Build for Vercel
              run: npx vercel@latest build $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN"
              env:
                  VERCEL_PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

            - name: Deploy to Vercel
              run: npx vercel@latest deploy --prebuilt $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN"
              env:
                  VERCEL_PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
