name: Diagnose Vercel

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    diagnose:
        name: Diagnose deployment routing
        runs-on: ubuntu-latest
        steps:
            - name: Query Vercel API
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  api() {
                      url="$1"
                      code=$(curl -sS -o /tmp/vercel-response.json -w '%{http_code}' \
                          -H "Authorization: Bearer $VERCEL_TOKEN" "$url")
                      echo "HTTP $code $url"
                      jq . /tmp/vercel-response.json 2>/dev/null || cat /tmp/vercel-response.json
                      echo
                  }

                  DEPLOYMENT_ID=dpl_8QzNz7D683GLWyLzKm4KKeLrsWyh

                  echo "== deployment =="
                  api "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID" \
                      | jq '{id, url, readyState, type, framework, routes, functions, regions, build, output}'

                  echo "== deployment files =="
                  api "https://api.vercel.com/v6/deployments/$DEPLOYMENT_ID/files" \
                      | jq '[.. | objects | select(has("name")) | .name] | unique | .[]' 2>/dev/null || true
