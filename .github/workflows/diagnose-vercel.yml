name: Diagnose Vercel

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    diagnose:
        name: Set project framework
        runs-on: ubuntu-latest
        steps:
            - name: Update project framework
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  curl -sS -X PATCH \
                      -H "Authorization: Bearer $VERCEL_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d '{"framework":"nextjs"}' \
                      "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
                      | jq '{id, name, framework, buildCommand, outputDirectory}'
