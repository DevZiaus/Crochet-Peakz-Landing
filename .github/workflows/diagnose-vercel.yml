name: Diagnose Vercel

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    diagnose:
        name: Diagnose domain and alias
        runs-on: ubuntu-latest
        steps:
            - name: Query Vercel API
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  api() {
                      url="$1"
                      code=$(curl -sS -o /tmp/vercel-response.json -w '%{http_code}' \
                          -H "Authorization: Bearer $VERCEL_TOKEN" "$url")
                      echo "HTTP $code $url"
                      jq . /tmp/vercel-response.json 2>/dev/null || cat /tmp/vercel-response.json
                      echo
                  }

                  echo "== user =="
                  api "https://api.vercel.com/v2/user"

                  echo "== project (no teamId) =="
                  api "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID"

                  echo "== project (teamId) =="
                  api "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"

                  echo "== project domains (no teamId) =="
                  api "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains"

                  echo "== project domains (teamId) =="
                  api "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID"

                  echo "== apex domain (no teamId) =="
                  api "https://api.vercel.com/v5/domains/crochetpeakz.tech"

                  echo "== apex domain (teamId) =="
                  api "https://api.vercel.com/v5/domains/crochetpeakz.tech?teamId=$VERCEL_ORG_ID"

                  echo "== aliases (no teamId) =="
                  api "https://api.vercel.com/v4/aliases?limit=100"

                  echo "== aliases (teamId) =="
                  api "https://api.vercel.com/v4/aliases?limit=100&teamId=$VERCEL_ORG_ID"

                  echo "== deployments (no teamId) =="
                  api "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=5"

                  echo "== deployments (teamId) =="
                  api "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=5&teamId=$VERCEL_ORG_ID"
